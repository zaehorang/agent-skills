<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TODO(제목): 전문용어 없이, 이 파일이 무엇을 이해시키는지 한 문장 -->
<title>요청 하나가 줄을 거쳐 처리되기까지</title>
<style>
/* ── 테마 토큰: 세 군데(라이트 · 시스템 다크 · 강제 다크)에 같은 키를 둔다 ── */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --ink:#15181d; --ink2:#5a6372;
  --line:#d8dde5; --line2:#e8ebf0;
  --acc:#1f6feb; --acc-w:#e7f0ff;
  --ok:#128a53; --ok-w:#e2f5ec;
  --warn:#c2410c; --warn-w:#fdeee4;
  --err:#c02626; --err-w:#fdecec;
  --code:#0f1319; --code-ink:#dbe2ea;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --ink:#e6edf3; --ink2:#9aa6b2;
    --line:#2d333b; --line2:#22272e;
    --acc:#58a6ff; --acc-w:#132744;
    --ok:#3fb950; --ok-w:#0f2a1a;
    --warn:#e0862a; --warn-w:#2d1d0b;
    --err:#f85149; --err-w:#2d1113;
    --code:#010409; --code-ink:#c9d1d9;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --ink:#e6edf3; --ink2:#9aa6b2;
  --line:#2d333b; --line2:#22272e;
  --acc:#58a6ff; --acc-w:#132744;
  --ok:#3fb950; --ok-w:#0f2a1a;
  --warn:#e0862a; --warn-w:#2d1d0b;
  --err:#f85149; --err-w:#2d1113;
  --code:#010409; --code-ink:#c9d1d9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
     font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1680px;margin:0 auto;padding:20px 18px 64px}

/* ── header ── */
header.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.01em}
header.top p{margin:0;color:var(--ink2);font-size:13px;flex:1 1 260px}
.themebtn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.themebtn:hover{border-color:var(--acc);color:var(--acc)}

/* ── step rail ── */
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:6px}
.rail button{border:1px solid var(--line);background:var(--panel);
  color:var(--ink2);border-radius:9px;padding:7px 6px 8px;cursor:pointer;font-family:inherit;
  font-size:11.5px;line-height:1.3;text-align:center;transition:all .18s}
.rail button .no{display:block;font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}
.rail button:hover{border-color:var(--acc);color:var(--ink)}
.rail button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.rail button.on .no{opacity:.8}
.rail button.seen{color:var(--ink)}

/* ── layout: 무대가 60% 이상 (1.8fr : 1fr) ── */
.cols{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1060px){ .cols{grid-template-columns:minmax(0,1fr)} }

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stagewrap{padding:0;overflow:hidden;position:relative}
#cam{transform-origin:0 0;transition:transform .55s cubic-bezier(.25,.8,.3,1)}
.viewbtn{position:absolute;right:10px;bottom:10px;z-index:2;border:1px solid var(--line);
  background:var(--panel);color:var(--ink2);border-radius:8px;padding:5px 11px;font-size:11.5px;
  font-family:inherit;cursor:pointer;opacity:.85;backdrop-filter:blur(3px)}
.viewbtn:hover{border-color:var(--acc);color:var(--acc);opacity:1}

/* ── demo bar: 조작과 결과를 무대 바로 위에 ── */
.demobar{border-bottom:1px solid var(--line2);padding:11px 13px;background:var(--panel2);
  border-radius:13px 13px 0 0}
.demobar.empty{display:none}
.demorow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demobtn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:9px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.demobtn:hover{filter:brightness(1.08)}
.demobtn.on{background:var(--panel);color:var(--acc)}
.hint{font-size:12.5px;color:var(--ink2);flex:1 1 200px;min-width:160px}
.verdict{margin-top:8px;font-size:13px;padding:9px 11px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line2);color:var(--ink);min-height:36px;
  display:block;line-height:1.55}
.verdict b{color:var(--acc)}
.verdict.bad b{color:var(--err)}
.verdict.good b{color:var(--ok)}

/* ── svg stage ── */
.stage{display:block;width:100%;height:auto;background:var(--panel)}
.reg{transition:opacity .3s}
.reg.dim{opacity:.2}
.regbox{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
.regttl{fill:var(--ink2);font:600 12px var(--sans);letter-spacing:.02em}
/* 노드 — 역할 라벨(.t1) 13px · 원래 이름(.t2) 11px. 화면 실효 px = 글꼴 × 카메라 배율 × (무대 렌더 폭 ÷ 1000). 전체 보기에서도 12px 를 넘겨야 한다 */
.nd rect{fill:var(--panel);stroke:var(--line);stroke-width:1.4;transition:fill .3s,stroke .3s,stroke-width .3s}
.nd .t1{fill:var(--ink);font:600 13px var(--sans);text-anchor:middle}
.nd .t2{fill:var(--ink2);font:500 11px var(--mono);text-anchor:middle}
.nd.idle rect{opacity:.72}
.nd.pending rect{stroke-dasharray:4 3;stroke:var(--ink2)}
.nd.active rect{stroke:var(--acc);stroke-width:2.4;fill:var(--acc-w);animation:pulse 1.8s ease-in-out infinite}
.nd.active .t1{fill:var(--acc)}
.nd.done rect{stroke:var(--ok);stroke-width:1.8;fill:var(--ok-w)}
.nd.done .t1{fill:var(--ok)}
.nd.err rect{stroke:var(--err);stroke-width:2.4;fill:var(--err-w)}
.nd.err .t1{fill:var(--err)}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
.edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arw);transition:stroke .3s}
.edge.done{stroke:var(--ok);marker-end:url(#arwOk)}
.edge.active{stroke:var(--acc);stroke-width:2.2;marker-end:url(#arwAcc);
  stroke-dasharray:9 6;animation:flow .9s linear infinite}
.edge.err{stroke:var(--err);marker-end:url(#arwErr);stroke-dasharray:3 4}
.edge.off{opacity:.18}
@keyframes flow{to{stroke-dashoffset:-30}}
/* 움직이는 칸 — 제자리 좌표는 JS 의 BASE 에 있고, 인라인 transform 으로만 옮긴다 */
.item rect{fill:var(--acc-w);stroke:var(--acc);stroke-width:1.4}
.item text{fill:var(--acc);font:600 10px var(--mono);text-anchor:middle}

/* ── right column ── */
.narr{padding:15px 17px}
.narr .kicker{font:700 10.5px var(--mono);letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.narr h2{font-size:17.5px;margin:6px 0 9px;line-height:1.38;letter-spacing:-.01em}
.narr p{margin:0 0 9px;font-size:14px;color:var(--ink)}
.narr ul{margin:0 0 9px;padding-left:18px;font-size:13.5px}
.narr li{margin:3px 0}
.narr em{font-style:normal;background:var(--acc-w);color:var(--acc);padding:0 4px;border-radius:4px;font-weight:600}
/* 1단계 범례: 비유 ↔ 실제 이름 대조표. 공백 정렬 대신 표로 */
table.legend{border-collapse:collapse;font-size:12.5px;margin:6px 0 10px;width:100%}
table.legend th,table.legend td{border:1px solid var(--line2);padding:4px 8px;text-align:left}
table.legend th{background:var(--panel2);color:var(--ink2);font-weight:600}
table.legend code{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

.panes{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){ .panes.two{grid-template-columns:1fr 1fr} }
.pane{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel2);min-width:0}
.pane h4{margin:0;font-size:11px;padding:6px 10px;background:var(--panel2);color:var(--ink2);
  border-bottom:1px solid var(--line2);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.pane h4 span{font-family:var(--mono);font-size:10px;opacity:.75}
.pane pre{margin:0;padding:9px 10px;background:var(--code);color:var(--code-ink);
  font-family:var(--mono);font-size:11.5px;line-height:1.62;overflow-x:auto;
  font-variant-numeric:tabular-nums}
.hl{display:block;background:rgba(31,111,235,.20);box-shadow:inset 2px 0 0 var(--acc);
    padding-left:6px;margin-left:-6px}
.hl.ok{background:rgba(18,138,83,.20);box-shadow:inset 2px 0 0 var(--ok)}
.hl.bad{background:rgba(192,38,38,.22);box-shadow:inset 2px 0 0 var(--err)}
.cm{color:#7d8899}
.ky{color:#79c0ff} .st{color:#a5d6ff} .gd{color:#7ee787} .bd{color:#ff7b72}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--code-ink);
  vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ── terms ── */
details.terms{margin-top:12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
details.terms>summary{cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--ink2);
  font-weight:600;list-style:none}
details.terms>summary::-webkit-details-marker{display:none}
details.terms>summary::before{content:"＋ ";color:var(--acc)}
details.terms[open]>summary::before{content:"－ "}
details.terms .body{padding:2px 12px 11px;border-top:1px solid var(--line2)}
details.terms dl{margin:0}
details.terms dt{font-size:13px;font-weight:700;margin-top:9px}
details.terms dt span{font-family:var(--mono);font-size:10.5px;color:var(--ink2);font-weight:500;margin-left:5px}
details.terms dd{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.58}
details.terms dd b{color:var(--ink)}

/* ── nav ── */
.nav{display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:9px;padding:8px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600}
.nav button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.nav button:disabled{opacity:.38;cursor:default}
.count{font-family:var(--mono);font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.keyhint{font-size:11.5px;color:var(--ink2);margin-left:auto}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink2);line-height:1.7}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <!-- TODO(제목): h1 은 <title> 과 같게, p 는 "무엇이 무엇이 되기까지 — N단계" -->
  <h1>요청 하나가 줄을 거쳐 처리되기까지</h1>
  <p>보내는 쪽이 요청을 던지면 <b>줄 서는 곳</b>에 잠시 머물다 <b>처리하는 쪽</b>이 꺼내 간다 — 3단계.</p>
  <button class="themebtn" id="themeBtn" type="button">◐ 테마</button>
</header>

<nav class="rail" id="rail" aria-label="단계 이동"></nav>

<div class="cols">
  <!-- 좌: 조작 + 무대 -->
  <section class="card stagewrap">
    <div class="demobar" id="demobar">
      <div class="demorow">
        <button class="demobtn" id="demoBtn" type="button"></button>
        <span class="hint" id="demoHint"></span>
      </div>
      <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
    </div>

    <!-- TODO(무대): 좌표계는 1000×560 을 유지하고 안의 구역·노드·선만 바꾼다.
         구역 id 는 r_*, 노드 id 는 n_*, 선 id 는 e_* — JS 의 REGBOX · NODES · EDGES 와 맞춘다.
         무대 내용 전체는 <g id="cam"> 안에 둔다 (카메라가 이 그룹을 움직인다). -->
    <svg class="stage" id="stage" viewBox="0 0 1000 560" role="img"
         aria-label="요청이 보내는 쪽에서 줄 서는 곳을 거쳐 처리하는 쪽에 닿는 전체 그림">
      <defs>
        <marker id="arw" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--line)"/></marker>
        <marker id="arwAcc" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--acc)"/></marker>
        <marker id="arwOk" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--ok)"/></marker>
        <marker id="arwErr" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--err)"/></marker>
      </defs>
      <g id="cam">

      <!-- 구역 A: 보내는 쪽 -->
      <g class="reg" id="r_a">
        <rect class="regbox" x="20" y="60" width="290" height="300" rx="14"/>
        <text class="regttl" x="34" y="84">보내는 쪽</text>
        <g class="nd idle" id="n_sender" transform="translate(45,180)">
          <rect width="220" height="56" rx="9"/>
          <text class="t1" x="110" y="28">요청 보내는 사람</text>
          <text class="t2" x="110" y="46">producer</text>
        </g>
      </g>

      <!-- 구역 B: 줄 서는 곳 -->
      <g class="reg" id="r_b">
        <rect class="regbox" x="330" y="60" width="340" height="300" rx="14"/>
        <text class="regttl" x="344" y="84">줄 서는 곳</text>
        <g class="nd idle" id="n_queue" transform="translate(355,110)">
          <rect width="290" height="220" rx="9"/>
          <text class="t1" x="145" y="28">대기 줄</text>
          <text class="t2" x="145" y="46">queue</text>
        </g>
        <!-- 움직이는 칸 — 제자리는 JS BASE 에, 처음엔 숨김 -->
        <g class="item" id="i_req" style="opacity:0">
          <rect width="120" height="30" rx="6"/>
          <text x="60" y="20">req #1</text>
        </g>
      </g>

      <!-- 구역 C: 처리하는 쪽 -->
      <g class="reg" id="r_c">
        <rect class="regbox" x="690" y="60" width="290" height="300" rx="14"/>
        <text class="regttl" x="704" y="84">처리하는 쪽</text>
        <g class="nd idle" id="n_worker" transform="translate(715,180)">
          <rect width="220" height="56" rx="9"/>
          <text class="t1" x="110" y="28">요청 처리하는 사람</text>
          <text class="t2" x="110" y="46">consumer</text>
        </g>
      </g>

      <!-- 선: 보내는 쪽 → 줄 · 줄 → 처리하는 쪽 (40px 이상이어야 흐름이 보인다) -->
      <path class="edge off" id="e_send" d="M268,208 L352,208"/>
      <path class="edge off" id="e_take" d="M648,208 L712,208"/>

      </g>
    </svg>
    <button class="viewbtn" id="viewBtn" type="button" aria-pressed="false">전체 보기</button>
  </section>

  <!-- 우: 설명 + 산출물 -->
  <section>
    <div class="card narr">
      <span class="kicker" id="kicker"></span>
      <h2 id="title"></h2>
      <div id="desc"></div>
      <div class="panes" id="panes"></div>
      <div id="termsHost"></div>
    </div>

    <div class="nav">
      <button id="prev" type="button">← 이전</button>
      <button id="next" type="button">다음 →</button>
      <span class="count" id="count"></span>
      <span class="keyhint">← → 키로도 넘어갑니다</span>
    </div>
  </section>
</div>

<footer>
  <!-- TODO(푸터): 단순화한 것 · 이름을 바꾼 것을 한두 문장으로 -->
  이 그림은 실제 구조를 이해에 맞게 단순화한 것입니다. 코드·로그 예시는 실제 포맷을 따르되 값은 읽기 쉽게 줄였습니다.
</footer>
</div>
<script>
(function(){
"use strict";
var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function $(id){ return document.getElementById(id); }

/* ── 무대 목록: SVG 의 id 와 맞춘다 ─────────────────────── */
var NST   = ["idle","pending","active","done","err"];
var NODES = ["n_sender","n_queue","n_worker"];
var EDGES = ["e_send","e_take"];
var REGS  = ["r_a","r_b","r_c"];
var REGBOX = { r_a:[20,60,290,300], r_b:[330,60,340,300], r_c:[690,60,290,300] };   // 카메라가 맞출 경계 상자
var BASE  = { i_req:[440,230] };                                                      // 움직이는 칸의 제자리
var VW = 1000, VH = 560, fullView = false;

/* ── 상태 헬퍼: DOM 을 다시 그리지 않고 클래스만 바꾼다 ── */
function setNode(id, s){
  var el = $(id); if(!el) return;
  for(var i=0;i<NST.length;i++) el.classList.remove(NST[i]);
  el.classList.add(s || "idle");
}
function setEdge(id, s){
  var el = $(id); if(!el) return;
  el.classList.remove("off","active","done","err");
  if(s && s !== "on") el.classList.add(s);
}
/* 인라인 transform 은 기존 배치를 통째로 덮는다 — 제자리(BASE) + 밀어낼 값을 합쳐서 쓴다 */
function setPos(id, dx, dy, opacity, trans){
  var el = $(id), b = BASE[id]; if(!el || !b) return;
  el.style.transition = (RM || !trans) ? "none" : trans;
  el.style.transform  = "translate(" + (b[0]+dx) + "px," + (b[1]+dy) + "px)";
  if(opacity !== undefined) el.style.opacity = opacity;
}
function reflow(){ void document.documentElement.offsetWidth; }   // 시작 위치 → 리플로우 → 목표 위치

var T_MOVE = "transform .55s cubic-bezier(.25,.8,.3,1), opacity .35s linear";
var T_IN   = "transform .5s cubic-bezier(.2,.85,.3,1.08), opacity .4s linear";
var T_OUT  = "transform .7s cubic-bezier(.4,0,.75,.3), opacity .28s linear 420ms";

/* ── 타이머: 한 배열에 등록하고 단계 전환·토글마다 한 번에 정리 ── */
var timers = [];
function tick(fn, ms){ var id = setInterval(fn, ms); timers.push(id); return id; }
function delay(fn, ms){ var id = setTimeout(fn, ms); timers.push(id); return id; }
function stopAll(){ timers.forEach(function(id){ clearInterval(id); clearTimeout(id); }); timers = []; }

/* 살아 있는 화면: 줄 단위 append, 길이 고정 */
function logTo(id, line, max){
  var el = $(id); if(!el) return;
  var rows = el.getAttribute("data-rows") ? JSON.parse(el.getAttribute("data-rows")) : [];
  rows.push(line);
  while(rows.length > (max||7)) rows.shift();
  el.setAttribute("data-rows", JSON.stringify(rows));
  el.innerHTML = rows.join("\n") + "\n<span class='cursor'></span>";
}

/* ── 카메라: 단계가 켠 구역의 경계 상자를 화면에 꽉 차게 ── */
function viewBoxFor(s){
  var f = (!fullView && s && s.graph) ? s.graph.focus : null;
  if(!f || !f.length) return [0,0,VW,VH];
  var x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  f.forEach(function(id){
    var b = REGBOX[id]; if(!b) return;
    x0=Math.min(x0,b[0]); y0=Math.min(y0,b[1]); x1=Math.max(x1,b[0]+b[2]); y1=Math.max(y1,b[1]+b[3]);
  });
  if(x0 > x1) return [0,0,VW,VH];
  var pad = 22;
  return [x0-pad, y0-pad, (x1-x0)+pad*2, (y1-y0)+pad*2];
}
function applyView(s){
  var cam = $("cam"), b = viewBoxFor(s);
  var sc = Math.min(VW/b[2], VH/b[3], 1.95);                      // 과확대 상한
  var tx = VW/2 - sc*(b[0]+b[2]/2), ty = VH/2 - sc*(b[1]+b[3]/2);
  tx = Math.min(0, Math.max(VW*(1-sc), tx));                      // 지도 밖 빈 공간 금지
  ty = Math.min(0, Math.max(VH*(1-sc), ty));
  cam.style.transition = RM ? "none" : "";
  cam.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
}

/* ── 패널 조각 ── */
function pane(title, sub, body, id){
  return "<div class='pane'><h4>" + title + "<span>" + (sub||"") + "</span></h4><pre" + (id?" id='"+id+"'":"") + ">" + body + "</pre></div>";
}
var C = { c:function(s){return "<span class='cm'>"+s+"</span>";}, k:function(s){return "<span class='ky'>"+s+"</span>";},
          s:function(s){return "<span class='st'>"+s+"</span>";}, g:function(s){return "<span class='gd'>"+s+"</span>";},
          b:function(s){return "<span class='bd'>"+s+"</span>";} };
function hl(cls, s){ return "<span class='hl "+cls+"'>"+s+"</span>"; }

/* ── 단계 정의 ──────────────────────────────────────────────

var STEPS = [];

       "<table class='legend'><tr><th>이 글에서 부르는 말</th><th>실제 이름</th><th>하는 일</th></tr>"+

       "<tr><td>요청 처리하는 사람</td><td><code>consumer</code></td><td>줄 앞에서 하나 꺼내 처리한다</td></tr></table>"+
       "<ul><li>보내는 쪽과 처리하는 쪽은 <b>서로를 직접 모른다</b>. 둘 사이에 줄만 있다.</li>"+
       "<li>줄이 없으면 처리하는 쪽이 바쁠 때 보내는 쪽도 같이 멈춘다.</li></ul>",
  graph:{ focus:[], n:{}, e:{} },
  panels:"",
  terms:[
    {ko:"대기 줄", en:"queue", def:"먼저 들어온 것이 먼저 나가는 <b>저장 공간</b>. 이 글에서는 보내는 쪽과 처리하는 쪽 사이의 완충 역할로 나옵니다."}
  ]
});

/* 2 ─ 요청이 줄에 들어간다 (움직임 + 자동 반복 시연) */
STEPS.push({
  nav:"넣기",
  kicker:"1 / 2",
  title:"보내는 쪽은 줄에 넣고 바로 손을 뗀다",
  desc:"<p>요청은 처리하는 쪽이 아니라 <em>줄의 맨 뒤</em>에 놓입니다. 보내는 쪽은 그 순간 할 일이 끝납니다.</p>"+
       "<ul><li>줄에 들어간 요청은 처리 전까지 그 자리에 그대로 있다.</li>"+
       "<li>처리하는 쪽이 느려도 보내는 쪽은 기다리지 않는다.</li>"+
       "<li>없으면: 처리하는 쪽이 멈춘 순간 보내는 쪽의 요청도 함께 버려진다.</li></ul>",
  graph:{ focus:["r_a","r_b"], n:{ n_sender:"active", n_queue:"pending" }, e:{ e_send:"active" } },
  panelsTwo:true,
  panels:
    pane("줄에 넣기 전","before", C.c("# queue") + "\n[ ]") +
    pane("줄에 넣은 후","after",  C.c("# queue") + "\n" + hl("ok", "[ " + C.g("req #1") + " ]")),
  terms:[
    {ko:"넣기", en:"enqueue", def:"줄의 <b>맨 뒤</b>에 하나를 붙이는 동작. 앞에 몇 개가 있든 비용이 같습니다."}
  ],
  enter:function(){ moveIn(false); },
  demo:{ auto:true, label:"요청 하나 넣기", labelOn:"꺼내서 되돌리기",
    hint:"요청 칸이 어디서 어디로 가는지 보세요.",
    run:function(on){
      moveIn(on);
      return on ? {t:"요청이 <b>줄의 맨 뒤</b>에 들어갔습니다. 보내는 쪽은 더 할 일이 없습니다.", tone:"good"}
                : {t:"줄이 비었습니다. 다시 눌러 넣어 보세요.", tone:""};
    }}
});
function moveIn(on){
  if(!on){ setPos("i_req", -250, 0, 0, "none"); return; }   // 시작 위치: 보내는 쪽 옆, 숨김
  setPos("i_req", -250, 0, 0, "none");
  reflow();
  setPos("i_req", 0, 0, 1, T_IN);                           // 목표 위치: 줄 안
}

/* 3 ─ 처리하는 쪽이 꺼낸다 (살아 있는 로그) */
STEPS.push({
  nav:"꺼내기",
  kicker:"2 / 2",
  title:"처리하는 쪽은 자기 속도로 줄 앞에서 하나씩 꺼낸다",
  desc:"<p>처리하는 쪽은 보내는 쪽을 쳐다보지 않습니다. <em>줄의 맨 앞</em>만 봅니다.</p>"+
       "<ul><li>꺼낸 요청은 줄에서 사라지고 처리하는 쪽으로 넘어간다.</li>"+
       "<li>처리하는 쪽을 늘리면 같은 줄을 여럿이 나눠 꺼낸다.</li>"+
       "<li>없으면: 보내는 속도가 처리 속도를 넘는 순간 요청이 어디서도 기다릴 수 없다.</li></ul>",
  graph:{ focus:["r_b","r_c"], n:{ n_queue:"done", n_worker:"active" }, e:{ e_take:"active" } },
  panels: pane("처리 로그","consumer", "", "log3"),
  terms:[
    {ko:"꺼내기", en:"dequeue", def:"줄의 <b>맨 앞</b>에서 하나를 떼어 내는 동작. 넣기와 짝을 이룹니다."}
  ],
  enter:function(){
    setPos("i_req", 0, 0, 1, "none");
    var n = 1;
    tick(function(){                                         // 단계를 벗어나면 stopAll 이 멈춘다
      n += 1;
      logTo("log3", C.c(new Date().toISOString().slice(11,19)) + " " + C.k("take") + " req #" + n + " " + C.g("ok"), 6);

/* ── 기준 상태: 단계 진입도, 시연의 되돌리기도 반드시 여기를 거친다 ── */
function resetGraph(){
  NODES.forEach(function(id){ setNode(id,"idle"); });
  EDGES.forEach(function(id){ setEdge(id,"off"); });
  REGS.forEach(function(id){ var el=$(id); if(el) el.classList.remove("dim"); });
  for(var k in BASE) if(BASE.hasOwnProperty(k)) setPos(k, 0, 0, 0, "none");
  reflow();
}
function applyGraph(g){
  g = g || {};
  if(g.focus && g.focus.length){
    REGS.forEach(function(id){ var el=$(id); if(el) el.classList.toggle("dim", g.focus.indexOf(id) === -1); });
  }
  if(g.n) for(var k in g.n) if(g.n.hasOwnProperty(k)) setNode(k, g.n[k]);
  if(g.e) for(var j in g.e) if(g.e.hasOwnProperty(j)) setEdge(j, g.e[j]);
}
function renderTerms(s){
  var host = $("termsHost");
  if(!s.terms || !s.terms.length){ host.innerHTML = ""; return; }
  var h = "<details class='terms'><summary>이 단계에서 처음 나온 말 " + s.terms.length + "개</summary><div class='body'><dl>";
  s.terms.forEach(function(t){ h += "<dt>" + t.ko + "<span>" + (t.en||"") + "</span></dt><dd>" + t.def + "</dd>"; });
  host.innerHTML = h + "</dl></div></details>";
}

/* ── 시연: 버튼 하나 · aria-pressed · 판정 문장(aria-live) · auto 면 왕복 반복, 사람이 누르면 루프 종료 ── */
var demoOn = false;
function renderDemo(s){
  var bar=$("demobar"), btn=$("demoBtn"), hint=$("demoHint"), v=$("verdict");
  if(!s.demo){ bar.classList.add("empty"); btn.onclick = null; return; }
  bar.classList.remove("empty");
  demoOn = false;
  hint.textContent = s.demo.hint || "";
  v.className = "verdict";
  v.innerHTML = "<span style='color:var(--ink2)'>버튼을 눌러 보세요.</span>";
  function apply(on){
    demoOn = on;
    btn.textContent = on ? (s.demo.labelOn || "되돌리기") : s.demo.label;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    var r = s.demo.run(on);
    if(r){ v.className = "verdict" + (r.tone ? " " + r.tone : ""); v.innerHTML = r.t; }
  }
  apply(false);
  v.innerHTML = "<span style='color:var(--ink2)'>버튼을 눌러 보세요.</span>";
  var looping = false;
  function loop(){                                   // 켠 쪽 2.6s · 되돌린 쪽 1.4s
    if(!looping) return;
    apply(true);
    delay(function(){ if(!looping) return; apply(false); delay(loop, 1400); }, 2600);
  }
  if(s.demo.auto && !RM){ looping = true; delay(loop, 700); }
  btn.onclick = function(){
    if(looping){ looping = false; stopAll(); }       // 사람이 만지면 자동 반복은 멈춘다
    apply(!demoOn);
  };
}

/* ── 레일 · go ── */
var cur = -1, seen = {};
function renderRail(){
  var h = "";
  STEPS.forEach(function(s,i){
    h += "<button type='button' data-i='" + i + "' class='" + (i===cur?"on":(seen[i]?"seen":"")) +
         "'><span class='no'>" + (i+1) + "</span>" + s.nav + "</button>";
  });
  $("rail").innerHTML = h;
  Array.prototype.forEach.call($("rail").querySelectorAll("button"), function(b){
    b.onclick = function(){ go(parseInt(b.getAttribute("data-i"),10)); };
  });
}
/* go 는 스크롤을 건드리지 않는다 */
function go(n){
  n = Math.max(0, Math.min(STEPS.length-1, n));
  cur = n; seen[n] = true;
  var s = STEPS[n];
  stopAll();
  resetGraph();
  $("kicker").textContent = s.kicker || "";
  $("title").textContent  = s.title;
  $("desc").innerHTML     = s.desc;
  var panes = $("panes");
  panes.className = "panes" + (s.panelsTwo ? " two" : "");
  panes.innerHTML = s.panels || "";
  renderTerms(s);
  applyGraph(s.graph);
  applyView(s);
  renderDemo(s);
  renderRail();
  $("count").textContent = (n+1) + " / " + STEPS.length;
  $("prev").disabled = (n === 0);
  $("next").disabled = (n === STEPS.length-1);
  if(s.enter) s.enter();
}
$("viewBtn").onclick = function(){
  fullView = !fullView;
  $("viewBtn").textContent = fullView ? "단계 구역만 보기" : "전체 보기";
  $("viewBtn").setAttribute("aria-pressed", fullView ? "true" : "false");
  applyView(STEPS[cur]);
};
$("prev").onclick = function(){ go(cur-1); };
$("next").onclick = function(){ go(cur+1); };
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key === "ArrowLeft"){ go(cur-1); }
  else if(e.key === "ArrowRight"){ go(cur+1); }
});
$("themeBtn").onclick = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme");
  r.setAttribute("data-theme", t === "dark" ? "light" : "dark");
};
go(0);
})();

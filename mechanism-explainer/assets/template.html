<!doctype html>
<!--
  mechanism-explainer 골격.

  갈아끼울 곳은 [[ ]] 로 표시했다. 그 외 스텝 엔진·테마·키보드 조작은 손대지 않는다.

  1. <title> 과 헤더 문구
  2. :root 팔레트 — 주제에 맞는 강조색 2개(주 계열/보조 계열)로 바꾼다. 회색도 강조색 쪽으로 살짝 치우치게.
  3. SVG 다이어그램 — 주제의 노드/엣지로 교체. id 는 유지 규칙만 지키면 자유.
  4. STEPS 배열 — 단계 정의. 이게 본체다.

  원칙: 다이어그램은 단계마다 다시 그리지 않는다. 같은 SVG 의 클래스만 바꾼다.
-->
<meta charset="utf-8">
<title>[[주제 이름 — 짧은 명사구]]</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ── 팔레트: [[주제에 맞게 교체]] ────────────────────────── */
:root {
  --ground:#f1f4f5; --surface:#fff; --surface-2:#f7f9fa;
  --ink:#181c22; --muted:#5c6672;
  --line:#dce1e5; --line-strong:#c4ccd1;
  --accent:#274b57;                       /* 주 강조 — 진행/현재 */
  --a1:#0f766e; --a1-soft:#d5ebe8;        /* 계열 1 (예: 내부) */
  --a2:#a8560a; --a2-soft:#f3e2cf;        /* 계열 2 (예: 외부) */
  --warn:#b3261e; --warn-soft:#f7dcd9;    /* 실패 경로 — 강조색과 다른 계열 */
  --shadow:0 1px 2px rgba(24,28,34,.06),0 8px 28px rgba(24,28,34,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#101317; --surface:#191d23; --surface-2:#1f242b;
  --ink:#e7eaed; --muted:#99a3ad;
  --line:#2b313a; --line-strong:#3a424d;
  --accent:#9db8c1;
  --a1:#56d3c6; --a1-soft:#12332f;
  --a2:#f0a860; --a2-soft:#3a2a17;
  --warn:#f2857c; --warn-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#101317; --surface:#191d23; --surface-2:#1f242b;
  --ink:#e7eaed; --muted:#99a3ad;
  --line:#2b313a; --line-strong:#3a424d;
  --accent:#9db8c1;
  --a1:#56d3c6; --a1-soft:#12332f;
  --a2:#f0a860; --a2-soft:#3a2a17;
  --warn:#f2857c; --warn-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* 강조색 위 글자. 라이트=밝은 배경 필요, 다크=어두운 배경 필요 */
:root{ --on-accent:var(--surface); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --on-accent:var(--ground);} }
:root[data-theme="dark"]{ --on-accent:var(--ground); }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(1.5rem,4vw,3.5rem) clamp(1rem,4vw,2rem) 5rem}

header.masthead{border-bottom:1px solid var(--line);padding-bottom:1.6rem;margin-bottom:2rem}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 .7rem}
h1{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-size:clamp(1.7rem,4.5vw,2.7rem);
  line-height:1.12;letter-spacing:-.02em;text-wrap:balance;margin:0 0 .6rem}
.standfirst{color:var(--muted);max-width:60ch;margin:0}
.standfirst b{color:var(--ink);font-weight:600}

/* 범례 — 1단계에서 어휘를 고정하는 장치. 지우지 말 것 */
.legend{display:flex;flex-wrap:wrap;gap:1.2rem;margin-top:1.3rem;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:.5rem}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.sw.a1{background:var(--a1)} .sw.a2{background:var(--a2)}

/* 스텝 레일 */
.rail{display:flex;gap:.35rem;margin:2.2rem 0 1.6rem}
.rail button{flex:1;min-width:0;appearance:none;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:.55rem .4rem;cursor:pointer;font:inherit;font-size:.7rem;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  transition:border-color .15s,background .15s,color .15s}
.rail button .n{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.78rem}
.rail button .lbl{display:none;text-align:center;line-height:1.25}
.rail button:hover{border-color:var(--line-strong)}
.rail button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:720px){ .rail button .lbl{display:block} }

/* 무대 */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden}
.stage-head{padding:1.3rem clamp(1rem,3vw,1.6rem) 1.1rem;border-bottom:1px solid var(--line)}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin:0 0 .4rem}
.stage-head h2{font-family:"Archivo",system-ui,sans-serif;font-weight:600;
  font-size:clamp(1.15rem,3vw,1.5rem);letter-spacing:-.015em;margin:0 0 .5rem;text-wrap:balance}
#desc p{margin:0;color:var(--muted);max-width:64ch}
#desc p+p{margin-top:.6rem}
#desc b{color:var(--ink);font-weight:600}
.stage-body{padding:clamp(1rem,3vw,1.6rem);display:grid;gap:1.4rem}

/* ① 다이어그램 */
.graph-box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.8rem}
.graph-box svg{width:100%;height:auto;display:block}
.node rect,.node circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5;
  transition:fill .35s,stroke .35s}
.node text{font-family:"IBM Plex Mono",monospace;font-size:12px;fill:var(--ink);transition:fill .35s}
.node.idle rect,.node.idle circle{opacity:.55}
.node.pending rect,.node.pending circle{stroke-dasharray:4 3}
.node.active rect,.node.active circle{stroke:var(--accent);stroke-width:2.2}
.node.done rect,.node.done circle{fill:var(--a1);stroke:var(--a1)}
.node.done text{fill:var(--on-accent)}
.node.resolved rect,.node.resolved circle{fill:var(--a2-soft);stroke:var(--a2)}
.node.error rect,.node.error circle{fill:var(--warn-soft);stroke:var(--warn)}
.edge{stroke:var(--line-strong);stroke-width:1.6;fill:none;marker-end:url(#arrow);
  transition:stroke .35s,opacity .35s}
.edge.pending{stroke-dasharray:4 3}
/* 흐르는 방향은 계속 보여준다 — 멈춰 있는 화살표는 "지금 이쪽으로 간다"를 말해주지 않는다 */
.edge.active{stroke:var(--accent);stroke-dasharray:7 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){ .edge.active{animation:none;stroke-dasharray:none} }
.edge.dim{opacity:.3}
.badge circle{fill:var(--accent)}
.badge text{fill:var(--on-accent);font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
.badge.hidden{opacity:0}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  .node rect,.node circle,.node text,.edge,.badge{transition:none}
  .pulse{animation:none}
}

/* ② 산출물 */
.files{display:grid;gap:.9rem}
@media (min-width:780px){ .files.cols-2{grid-template-columns:1fr 1fr} }
figure.code{margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--surface-2);display:flex;flex-direction:column}
figure.code figcaption{font-family:"IBM Plex Mono",monospace;font-size:.76rem;padding:.5rem .8rem;
  border-bottom:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:.5rem}
figure.code figcaption .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--accent)}
figure.code.a1 figcaption .dot{background:var(--a1)}
figure.code.a2 figcaption .dot{background:var(--a2)}
figure.code pre{margin:0;padding:.85rem 1rem;overflow-x:auto;font-family:"IBM Plex Mono",monospace;
  font-size:.8rem;line-height:1.7;flex:1;font-variant-numeric:tabular-nums}
figure.code pre code{white-space:pre}
.c-key{color:var(--accent);font-weight:600}
.c-a1{color:var(--a1);font-weight:600}
.c-a2{color:var(--a2);font-weight:600}
.c-mut{color:var(--muted)}
/* 바뀐 줄 하이라이트 — 전체를 칠하지 말고 이 줄만 */
.hl{display:block;background:var(--a1-soft);margin:0 -1rem;padding:0 1rem;border-left:2px solid var(--a1)}
.hl.x{background:var(--a2-soft);border-left-color:var(--a2)}
.hl.err{background:var(--warn-soft);border-left-color:var(--warn)}

/* 변환 칩 — 스테이지 사이 수량 변화 */
.flow{display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--muted)}
.flow .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:.3rem .55rem;color:var(--ink)}
.flow .chip.a1{border-color:var(--a1);color:var(--a1)}
.flow .chip.a2{border-color:var(--a2);color:var(--a2)}

/* ③ 내레이션 강조 */
.note{font-size:.9rem;border-left:3px solid var(--accent);padding:.1rem 0 .1rem 1rem;color:var(--muted)}
.note b{color:var(--ink)}
.tag-a1,.tag-a2{font-family:"IBM Plex Mono",monospace;font-size:.82em;padding:.05em .4em;
  border-radius:4px;white-space:nowrap}
.tag-a1{background:var(--a1-soft);color:var(--a1)}
.tag-a2{background:var(--a2-soft);color:var(--a2)}

/* 단계 안의 시연 — 눌러서 결과를 보게 하는 조작 하나 */
.demo{margin-top:1.1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  padding:.9rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.8rem}
.demo button{appearance:none;font:inherit;font-size:.85rem;font-weight:600;padding:.5rem 1rem;
  border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
  cursor:pointer;transition:opacity .15s}
.demo button:hover{opacity:.88}
.demo button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo .hint{font-size:.85rem;color:var(--muted)}
/* 조작 후 판정 문장. 항상 같은 자리에서 갱신되어야 눈이 찾는다 */
.demo .verdict{flex:1 1 100%;font-size:.9rem;color:var(--ink);margin:0;
  border-left:3px solid var(--line-strong);padding-left:.9rem}
.demo.on .verdict{border-left-color:var(--warn)}

/* 살아 있는 화면: 로그가 흐르거나 입력을 기다리는 중이라는 표시 */
.cur{display:inline-block;width:.5em;height:1.05em;vertical-align:-.2em;background:var(--ink);
  opacity:.8;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){ .cur{animation:none} }

/* 조작 */
.stage-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:1rem clamp(1rem,3vw,1.6rem);border-top:1px solid var(--line);background:var(--surface-2)}
.count{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--muted)}
.stage-foot button{appearance:none;font:inherit;font-size:.85rem;font-weight:600;padding:.5rem 1rem;
  border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  cursor:pointer;transition:border-color .15s,background .15s}
.stage-foot button:hover:not(:disabled){border-color:var(--accent)}
.stage-foot button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stage-foot button:disabled{opacity:.4;cursor:not-allowed}
.stage-foot button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

footer.foot{margin-top:2.5rem;padding-top:1.4rem;border-top:1px solid var(--line);
  font-size:.82rem;color:var(--muted)}
footer.foot code{font-family:"IBM Plex Mono",monospace;background:var(--surface-2);
  padding:.1em .4em;border-radius:4px}
footer.foot a{color:var(--accent)}
.kb{font-family:"IBM Plex Mono",monospace;font-size:.78rem;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:4px;padding:.05em .4em;color:var(--muted)}

/* 용어 — 그 용어가 처음 나온 단계 안에 둔다. 최하단에 몰지 않는다.
   기본 접힘: 아는 사람은 지나가고 막힌 사람만 편다 */
.step-terms{border-top:1px dashed var(--line);padding-top:1rem}
.step-terms h3{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 .6rem}
.terms{display:grid;gap:.4rem}
@media (min-width:780px){ .terms{grid-template-columns:1fr 1fr;align-items:start} }
details.term{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:.6rem .85rem;font-size:.9rem}
details.term summary{cursor:pointer;font-weight:600;list-style:none;display:flex;
  align-items:baseline;gap:.5rem;flex-wrap:wrap}
details.term summary::-webkit-details-marker{display:none}
details.term summary::before{content:"+";font-family:"IBM Plex Mono",monospace;
  color:var(--accent);font-weight:600;flex:none}
details.term[open] summary::before{content:"−"}
details.term summary span{font-family:"IBM Plex Mono",monospace;font-size:.78rem;
  font-weight:400;color:var(--muted)}
details.term summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
details.term p{margin:.6rem 0 0 1.1rem;color:var(--muted);line-height:1.65}
details.term p b{color:var(--ink)}

/* 다이어그램 안 2줄 라벨: 역할을 크게, 진짜 이름을 작게 */
.node .role{font-size:12px;font-weight:600}
.node .real{font-size:9.5px;fill:var(--muted)}
</style>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">[[출처 · 무엇의 내부 동작인지]]</p>
    <h1>[[제목 — 결과가 아니라 과정을 가리키는 명사구]]</h1>
    <p class="standfirst">[[한 문단. 글로 읽으면 안 잡히는 게 뭔지, 이 페이지가 뭘 보여주는지.]]</p>
    <!-- 범례: 이후 단계에서 쓸 어휘를 여기서 고정한다 -->
    <div class="legend">
      <span><span class="sw a1"></span> [[계열 1이 뜻하는 것]]</span>
      <span><span class="sw a2"></span> [[계열 2가 뜻하는 것]]</span>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="단계 선택"></nav>

  <section class="stage" aria-live="polite">
    <div class="stage-head">
      <p class="kicker" id="kicker"></p>
      <h2 id="title"></h2>
      <div id="desc"></div>
    </div>
    <div class="stage-body">
      <!-- ① 상태 다이어그램: 단계마다 다시 그리지 않는다. 클래스만 바뀐다. -->
      <div class="graph-box" aria-hidden="true">
        <svg viewBox="0 0 520 200" role="img" aria-label="[[다이어그램 설명]]">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong)"></path>
            </marker>
          </defs>
          <!-- [[엣지: id는 e_ 로 시작]] -->
          <path id="e_a_b" class="edge" d="M148 58 L212 58"></path>
          <path id="e_b_c" class="edge" d="M322 58 L386 58"></path>
          <!-- [[노드: id는 n_ 로 시작. 클래스로 상태 표현]]
               라벨은 "그게 하는 일"을 크게(.role), 진짜 이름이 필요하면 작게(.real).
               이름만 적힌 노드는 이미 아는 사람만 읽을 수 있다. -->
          <g id="n_a" class="node" transform="translate(40,36)">
            <rect width="108" height="42" rx="7"></rect>
            <text class="role" x="14" y="20">[[하는 일]]</text>
            <text class="real" x="14" y="33">[[진짜 이름]]</text>
          </g>
          <g id="n_b" class="node" transform="translate(212,36)">
            <rect width="110" height="42" rx="7"></rect>
            <text class="role" x="14" y="20">[[하는 일]]</text>
            <text class="real" x="14" y="33">[[진짜 이름]]</text>
          </g>
          <g id="n_c" class="node" transform="translate(386,36)">
            <rect width="108" height="42" rx="7"></rect>
            <text class="role" x="14" y="20">[[하는 일]]</text>
            <text class="real" x="14" y="33">[[진짜 이름]]</text>
          </g>
          <!-- [[순서 배지: 순회를 보여줄 때만. id는 b_ 로 시작]] -->
          <g id="b_a" class="badge hidden" transform="translate(142,36)">
            <circle r="10"></circle><text x="-3" y="4">1</text>
          </g>
        </svg>
      </div>

      <!-- ②③ 산출물 + 내레이션 -->
      <div id="panels"></div>
      <!-- 단계 안의 시연 (선택) — 해당 단계에 demo 가 정의됐을 때만 뜬다 -->
      <div id="demo"></div>
      <!-- ④ 이 단계에서 처음 나온 용어. 최하단이 아니라 여기에 있어야 읽힌다 -->
      <div id="terms"></div>
    </div>
    <div class="stage-foot">
      <button id="prev" type="button">← 이전</button>
      <span class="count" id="count"></span>
      <button id="next" type="button" class="primary">다음 →</button>
    </div>
  </section>

  <footer class="foot">
    화살표 키 <span class="kb">←</span> <span class="kb">→</span> 로도 단계를 넘길 수 있다.
    [[출처·정확도 단서 한 줄 — 예: 개념 모델이며 실제 구현의 변수명은 다르다]]
  </footer>
</div>

<script>
(function(){
"use strict";

/* ── 헬퍼: 산출물 패널 조립 ───────────────────────────── */
function fig(cls, cap, body){
  return '<figure class="code '+cls+'"><figcaption><span class="dot"></span>'+cap+
         '</figcaption><pre><code>'+body+'</code></pre></figure>';
}
function note(html){ return '<p class="note">'+html+'</p>'; }
function flow(items){
  return '<div class="flow">'+items.map(function(i){
    return typeof i==='string' ? '<span>'+i+'</span>'
                               : '<span class="chip '+(i.k||'')+'">'+i.t+'</span>';
  }).join('')+'</div>';
}
/* 이 단계에서 처음 나온 용어. 최하단이 아니라 여기 있어야 막힌 사람이 읽는다 */
function renderTerms(list){
  if (!list || !list.length) return '';
  return '<div class="step-terms"><h3>이 단계에 나온 말</h3><div class="terms">'
    + list.map(function(t){
        return '<details class="term"><summary>'+t.ko
             + (t.en ? ' <span class="en">'+t.en+'</span>' : '')
             + '</summary><p>'+t.def+'</p></details>';
      }).join('')
    + '</div></div>';
}

/* ── 움직임 ──────────────────────────────────────────────
   기본은 클래스 토글이다. **무엇이 어디로 갔는가가 곧 내용일 때만** 여기를 쓴다.
   판단 기준: 그 움직임을 빼고 최종 화면만 봐도 같은 걸 알 수 있으면 움직이지 않는다.

   SVG 노드는 transform 속성으로 배치돼 있고, 인라인 CSS transform 이 그 속성을
   통째로 덮는다. 그래서 제자리 좌표를 BASE 에 들고 있다가 x 까지 매번 같이 쓴다
   (x 를 빼먹으면 요소가 왼쪽 끝으로 튄다).
   쓰지 않는 explainer 면 이 블록째 지워도 된다. */
var PITCH = 42;                         /* [[칸 하나 높이 + 간격]] */
var BASE = { /* [[n_a:[40,36], … 움직일 요소의 제자리 좌표]] */ };

function ease(delay){                   /* 자리 옮기기 */
  return reduced ? "none"
    : "transform .55s cubic-bezier(.25,.8,.3,1) "+delay+"ms, opacity .45s linear "+delay+"ms";
}
function enterEase(delay){              /* 들어오기 — 살짝 지나쳤다 자리잡기 */
  return reduced ? "none"
    : "transform .5s cubic-bezier(.2,.85,.3,1.08) "+delay+"ms, opacity .3s linear "+delay+"ms";
}
function exitEase(delay){               /* 나가기 — 움직인 다음에 사라진다 */
  return reduced ? "none"               /*   처음부터 흐려지면 "없어졌다"로 보인다 */
    : "transform .7s cubic-bezier(.4,0,.75,.3) "+delay+"ms, opacity .28s linear "+(delay+420)+"ms";
}
function setPos(id, dy, opacity, trans){
  var el = document.getElementById(id), b = BASE[id];
  if (!el || !b) return;
  el.style.transition = trans || "none";
  el.style.transform  = "translate("+b[0]+"px,"+(b[1]+dy)+"px)";
  el.style.opacity    = (opacity === undefined ? "" : opacity);
}
function motionReset(){                 /* 단계를 옮기면 밀어낸 것을 전부 제자리로 */
  Object.keys(BASE).forEach(function(id){ setPos(id, 0); });
}
function reflow(){ void document.documentElement.offsetWidth; }
/* 시작 위치를 잡고 → reflow() → 목표 위치를 주면 거기서부터 애니메이션된다 */

/* ── 단계 정의: 여기가 본체 ───────────────────────────────
   nav    : 레일에 뜨는 2~5자 라벨
   kicker : 이 단계가 무슨 국면인지 (예: "단계 A · resolution")
   title  : 이 단계가 끝나면 뭐가 달라져 있는지를 담은 한 문장
   desc   : 왜 이 단계가 필요한가. 없으면 뭐가 깨지는지까지.
   graph  : 다이어그램 상태 — { done:[id], active:[id], pending:[id],
            resolved:[id], error:[id], idle:[id], badges:[id],
            edges:{ id:'active'|'pending'|'dim' }, pulse:[id] }
   panels : 산출물 HTML
   terms  : [{ko, en, def}] — 이 단계에서 **처음** 나온 용어만 2~4개.
            앞 단계에서 이미 푼 건 넣지 않는다. 없으면 생략.
   enter  : (선택) 이 단계에 도착했을 때 한 번 실행할 움직임. 단계 전환 자체가
            뚝뚝 끊기지 않게 하는 용도 — 없으면 생략.
   demo   : (선택) 이 단계에서 독자가 직접 눌러보는 조작 하나.
            { label, labelOn, hint, run(on) } — run 은 토글 상태를 받아
            그래프/패널을 바꾸고 판정 문장(문자열)을 돌려준다. 없으면 생략.
            한 단계에 조작은 하나. 누르면 눈에 띄게 바뀌고, 다시 누르면 되돌아온다.
   단계는 5~9개. "before/after가 눈에 띄게 다른가"로 병합·분할한다.
─────────────────────────────────────────────────────── */
var STEPS = [
  {
    nav:"[[원본]]", kicker:"[[입력]]",
    title:"[[시작 상태를 한 문장으로]]",
    desc:"<p>[[여기서 등장 요소와 용어를 고정한다. 이후 단계는 이 어휘만 쓴다.]]</p>",
    graph:{ idle:["n_b","n_c"], active:["n_a"], edges:{ e_a_b:"dim", e_b_c:"dim" } },
    panels: fig("a1","[[파일명 · 역할]]",
              '<span class="c-key">const</span> x = 1;   <span class="c-mut">// 실제 코드를 쓴다</span>')
          + note("<b>읽는 법:</b> [[하이라이트가 뭘 뜻하는지]]"),
    terms: [
      { ko:"[[용어]]", en:"[[원어]]", def:"[[정의 + 지금 이 단계에서 왜 나오는가. 한두 문장.]]" }
    ]
  },
  {
    nav:"[[처리]]", kicker:"[[단계 A]]",
    title:"[[무엇이 무엇으로 바뀌는가]]",
    desc:"<p>[[왜 이 순서여야 하는지. 대안이 왜 안 되는지 한 줄.]]</p>",
    graph:{ done:["n_a"], active:["n_b"], idle:["n_c"],
            pulse:["n_b"], edges:{ e_a_b:"active", e_b_c:"dim" }, badges:["b_a"] },
    panels: '<div class="files cols-2">'
          + fig("a1","before", '[[변환 전]]')
          + fig("a1","after",  '<span class="hl">[[바뀐 줄만 하이라이트]]</span>')
          + '</div>'
          + flow([{t:"[[파일 3개]]",k:"a1"}, "→", {t:"[[파일 1개]]",k:"a1"}])
          + note("<b>핵심:</b> [[이 단계에서 실제로 일어난 일 한 줄]]"),
    demo: {
      label:"[[일어날 일 그대로 — 예: 캐시 비우기]]",
      labelOn:"[[되돌리기 — 예: 캐시 복구]]",
      hint:"[[무엇을 보라는 안내 한 줄]]",
      run: function(on){
        // 같은 사건을 걸었을 때 구조에 따라 결과가 어떻게 갈리는지 보여준다
        applyGraph(on ? { done:["n_a"], error:["n_b"], idle:["n_c"], edges:{ e_a_b:"dim" } }
                      : STEPS[1].graph);
        return on ? "[[눌렀을 때 무슨 일이 생겼나 — 한 문장]]"
                  : "[[원래 상태 설명 + 눌러보라는 유도]]";
      }
    },
    terms: [
      { ko:"[[용어]]", en:"[[원어]]", def:"[[…]]" },
      { ko:"[[용어]]", en:"[[원어]]", def:"[[…]]" }
    ]
  },
  {
    nav:"[[출력]]", kicker:"[[런타임]]",
    title:"[[최종 상태]]",
    desc:"<p>[[정상 경로 끝. 프로토콜류면 다음 단계부터 실패 시나리오를 붙인다.]]</p>",
    graph:{ done:["n_a","n_b","n_c"], edges:{ e_a_b:"active", e_b_c:"active" } },
    panels: fig("","[[런타임 로그]]",
              'run\n  step 1  <span class="c-a1">ok</span>\n  step 2  <span class="c-a1">ok</span>')
          + note("<b>[[가져갈 한 줄]]:</b> [[전이 가능한 규칙]]")
  }
];

/* ── 스텝 엔진: 아래는 손대지 않는다 ─────────────────── */
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var STATES = ["idle","pending","active","done","resolved","error"];
var nodes = [].slice.call(document.querySelectorAll('[id^="n_"]'));
var edges = [].slice.call(document.querySelectorAll('[id^="e_"]'));
var badges = [].slice.call(document.querySelectorAll('[id^="b_"]'));

function applyGraph(g){
  g = g || {};
  nodes.forEach(function(el){
    el.classList.remove.apply(el.classList, STATES);
    el.classList.remove("pulse");
  });
  edges.forEach(function(el){ el.classList.remove("active","pending","dim"); });
  badges.forEach(function(el){ el.classList.add("hidden"); });

  STATES.forEach(function(s){
    (g[s]||[]).forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.classList.add(s);
    });
  });
  if (!reduced) (g.pulse||[]).forEach(function(id){
    var el = document.getElementById(id); if (el) el.classList.add("pulse");
  });
  (g.badges||[]).forEach(function(id){
    var el = document.getElementById(id); if (el) el.classList.remove("hidden");
  });
  Object.keys(g.edges||{}).forEach(function(id){
    var el = document.getElementById(id); if (el) el.classList.add(g.edges[id]);
  });
}

var idx = 0;
var rail = document.getElementById("rail");
var elKicker = document.getElementById("kicker");
var elTitle  = document.getElementById("title");
var elDesc   = document.getElementById("desc");
var elPanels = document.getElementById("panels");
var elTerms  = document.getElementById("terms");
var elDemo   = document.getElementById("demo");
var elCount  = document.getElementById("count");
var elPrev   = document.getElementById("prev");
var elNext   = document.getElementById("next");

STEPS.forEach(function(s,i){
  var b = document.createElement("button");
  b.type = "button";
  b.innerHTML = '<span class="n">'+(i+1)+'</span><span class="lbl">'+s.nav+'</span>';
  b.addEventListener("click", function(){ go(i); });
  rail.appendChild(b);
});

/* 시연이 돌리는 반복(로그 흐르기 등)은 여기 등록한다. 단계를 옮기거나
   토글을 되돌리면 전부 멈춘다 — 안 멈추면 뒤 단계에서 유령처럼 계속 돈다 */
var demoTimers = [];
function demoTick(fn, ms){ var id = setInterval(fn, ms); demoTimers.push(id); return id; }
function demoDelay(fn, ms){ var id = setTimeout(fn, ms); demoTimers.push(id); return id; }
function demoStop(){
  demoTimers.forEach(function(id){ clearInterval(id); clearTimeout(id); });
  demoTimers = [];
}

/* 단계 안의 시연. 단계를 옮기면 항상 꺼진 상태로 리셋된다 */
function renderDemo(s){
  demoStop();
  elDemo.innerHTML = "";
  if (!s.demo) return;
  var on = false;
  var box = document.createElement("div"); box.className = "demo";
  var btn = document.createElement("button"); btn.type = "button";
  var hint = document.createElement("span"); hint.className = "hint";
  hint.textContent = s.demo.hint || "";
  var verdict = document.createElement("p"); verdict.className = "verdict";
  box.appendChild(btn); box.appendChild(hint); box.appendChild(verdict);
  elDemo.appendChild(box);

  function paint(){
    demoStop();
    btn.textContent = on ? (s.demo.labelOn || s.demo.label) : s.demo.label;
    box.classList.toggle("on", on);
    verdict.textContent = s.demo.run(on) || "";
  }
  btn.addEventListener("click", function(){ on = !on; paint(); });
  paint();
  /* auto: 단계에 들어오면 한 번은 저절로 보여준다. 그다음은 버튼으로 되돌리고 다시 본다.
     먼저 본 사람만 다시 눌러보게 되므로, 움직임이 그 단계의 요점일 때만 켠다 */
  if (s.demo.auto){
    if (reduced){ on = true; paint(); }         /* 움직임 없이 결과 상태만 */
    else {
      /* 저절로 왕복 재생한다 — 한 번만 움직이고 멈추면 못 본 사람은 영영 못 본다.
         켠 쪽을 오래 보여주고 잠깐 되돌린다. 사람이 버튼을 누르면 paint 가
         대기 중인 타이머를 비우므로 루프는 거기서 끝나고 조작권이 넘어간다 */
      var cycle = function(){
        on = !on; paint();
        demoDelay(cycle, on ? 2600 : 1400);
      };
      demoDelay(cycle, 700);
    }
  }
}

function go(n){
  idx = Math.max(0, Math.min(STEPS.length-1, n));
  var s = STEPS[idx];
  elKicker.textContent = s.kicker;
  elTitle.textContent  = s.title;
  elDesc.innerHTML     = s.desc;
  elPanels.innerHTML   = s.panels;
  elTerms.innerHTML    = renderTerms(s.terms);
  elCount.textContent  = (idx+1)+" / "+STEPS.length;
  elPrev.disabled = idx === 0;
  elNext.disabled = idx === STEPS.length-1;
  elNext.textContent = idx === STEPS.length-1 ? "끝" : "다음 →";
  Array.prototype.forEach.call(rail.children, function(b,i){
    b.setAttribute("aria-current", i===idx ? "true" : "false");
  });
  motionReset();            /* 앞 단계에서 밀어낸 것들을 제자리로 */
  applyGraph(s.graph);
  if (s.enter) s.enter();   /* 도착하자마자 한 번 움직여 보여줄 것이 있으면 */
  renderDemo(s);   /* 그래프를 깔고 난 뒤. 시연의 초기 상태가 최종 상태가 된다 */
  /* 스크롤은 건드리지 않는다. 단계를 넘길 때마다 화면이 위로 튀면
     읽던 자리를 잃고, 무엇이 바뀌었는지도 놓친다.
     다만 무대가 화면 위로 완전히 벗어나 있을 때만 최소한으로 끌어온다 */
  var box = document.querySelector(".stage").getBoundingClientRect();
  if (box.bottom < 80)
    document.querySelector(".stage").scrollIntoView({behavior: reduced?"auto":"smooth", block:"end"});
}

elPrev.addEventListener("click", function(){ go(idx-1); });
elNext.addEventListener("click", function(){ go(idx+1); });
document.addEventListener("keydown", function(e){
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") go(idx-1);
  else if (e.key === "ArrowRight") go(idx+1);
});

go(0);
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컨테이너와 쿠버네티스가 돌아가는 원리</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --ink:#15181d; --ink2:#5a6372;
  --line:#d8dde5; --line2:#e8ebf0;
  --acc:#1f6feb; --acc-w:#e7f0ff;
  --ok:#128a53; --ok-w:#e2f5ec;
  --warn:#c2410c; --warn-w:#fdeee4;
  --err:#c02626; --err-w:#fdecec;
  --code:#0f1319; --code-ink:#dbe2ea;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --ink:#e6edf3; --ink2:#9aa6b2;
    --line:#2d333b; --line2:#22272e;
    --acc:#58a6ff; --acc-w:#132744;
    --ok:#3fb950; --ok-w:#0f2a1a;
    --warn:#e0862a; --warn-w:#2d1d0b;
    --err:#f85149; --err-w:#2d1113;
    --code:#010409; --code-ink:#c9d1d9;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --ink:#e6edf3; --ink2:#9aa6b2;
  --line:#2d333b; --line2:#22272e;
  --acc:#58a6ff; --acc-w:#132744;
  --ok:#3fb950; --ok-w:#0f2a1a;
  --warn:#e0862a; --warn-w:#2d1d0b;
  --err:#f85149; --err-w:#2d1113;
  --code:#010409; --code-ink:#c9d1d9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
     font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1680px;margin:0 auto;padding:20px 18px 64px}

/* ── header ── */
header.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.01em}
header.top p{margin:0;color:var(--ink2);font-size:13px;flex:1 1 260px}
.themebtn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.themebtn:hover{border-color:var(--acc);color:var(--acc)}

/* ── step rail ── */
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:6px}
.rail button{border:1px solid var(--line);background:var(--panel);
  color:var(--ink2);border-radius:9px;padding:7px 6px 8px;cursor:pointer;font-family:inherit;
  font-size:11.5px;line-height:1.3;text-align:center;transition:all .18s}
.rail button .no{display:block;font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}
.rail button:hover{border-color:var(--acc);color:var(--ink)}
.rail button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.rail button.on .no{opacity:.8}
.rail button.seen{color:var(--ink)}

/* ── layout ── */
.cols{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1060px){ .cols{grid-template-columns:minmax(0,1fr)} }

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stagewrap{padding:0;overflow:hidden;position:relative}
#cam{transform-origin:0 0;transition:transform .55s cubic-bezier(.25,.8,.3,1)}
.viewbtn{position:absolute;right:10px;bottom:10px;z-index:2;border:1px solid var(--line);
  background:var(--panel);color:var(--ink2);border-radius:8px;padding:5px 11px;font-size:11.5px;
  font-family:inherit;cursor:pointer;opacity:.85;backdrop-filter:blur(3px)}
.viewbtn:hover{border-color:var(--acc);color:var(--acc);opacity:1}

/* ── demo bar (조작 + 결과를 무대 바로 위에) ── */
.demobar{border-bottom:1px solid var(--line2);padding:11px 13px;background:var(--panel2);
  border-radius:13px 13px 0 0}
.demobar.empty{display:none}
.demorow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demobtn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:9px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.demobtn:hover{filter:brightness(1.08)}
.demobtn.on{background:var(--panel);color:var(--acc)}
.hint{font-size:12.5px;color:var(--ink2);flex:1 1 200px;min-width:160px}
.verdict{margin-top:8px;font-size:13px;padding:9px 11px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line2);color:var(--ink);min-height:36px;
  display:block;line-height:1.55}
.verdict b{color:var(--acc)}
.verdict.bad b{color:var(--err)}
.verdict.good b{color:var(--ok)}

/* ── svg stage ── */
.stage{display:block;width:100%;height:auto;background:var(--panel)}
.reg{transition:opacity .3s}
.reg.dim{opacity:.2}
.regbox{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
.regttl{fill:var(--ink2);font:600 11px var(--sans);letter-spacing:.02em}
.nd rect{fill:var(--panel);stroke:var(--line);stroke-width:1.4;transition:fill .3s,stroke .3s,stroke-width .3s}
.nd .t1{fill:var(--ink);font:600 11.5px var(--sans);text-anchor:middle}
.nd .t2{fill:var(--ink2);font:500 9.5px var(--mono);text-anchor:middle}
.nd.idle rect{stroke-dasharray:none;opacity:.72}
.nd.pending rect{stroke-dasharray:4 3;stroke:var(--ink2)}
.nd.active rect{stroke:var(--acc);stroke-width:2.4;fill:var(--acc-w)}
.nd.active .t1{fill:var(--acc)}
.nd.done rect{stroke:var(--ok);stroke-width:1.8;fill:var(--ok-w)}
.nd.done .t1{fill:var(--ok)}
.nd.warn rect{stroke:var(--warn);stroke-width:2;fill:var(--warn-w)}
.nd.warn .t1{fill:var(--warn)}
.nd.err rect{stroke:var(--err);stroke-width:2.4;fill:var(--err-w)}
.nd.err .t1{fill:var(--err)}
.nd.active rect{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
.badge{font:700 9px var(--mono);text-anchor:middle;fill:var(--ink2)}
.nd.done .badge{fill:var(--ok)} .nd.err .badge{fill:var(--err)} .nd.active .badge{fill:var(--acc)}
.nd.warn .badge{fill:var(--warn)}
.edge{fill:none;stroke:var(--line);stroke-width:1.6;marker-end:url(#arw);transition:stroke .3s}
.edge.done{stroke:var(--ok);marker-end:url(#arwOk)}
.edge.active{stroke:var(--acc);stroke-width:2.2;marker-end:url(#arwAcc);
  stroke-dasharray:9 6;animation:flow .9s linear infinite}
.edge.err{stroke:var(--err);marker-end:url(#arwErr);stroke-dasharray:3 4}
.edge.off{opacity:.18}
@keyframes flow{to{stroke-dashoffset:-30}}
.elab{fill:var(--ink2);font:600 10px var(--sans)}
.elab.on{fill:var(--acc)}

/* ── right column ── */
.narr{padding:15px 17px}
.narr .kicker{font:700 10.5px var(--mono);letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.narr h2{font-size:17.5px;margin:6px 0 9px;line-height:1.38;letter-spacing:-.01em}
.narr p{margin:0 0 9px;font-size:14px;color:var(--ink)}
.narr p.q{color:var(--ink2);font-size:13px;border-left:2px solid var(--line);padding-left:10px}
.narr em{font-style:normal;background:var(--acc-w);color:var(--acc);padding:0 4px;border-radius:4px;font-weight:600}
.narr .no{background:var(--err-w);color:var(--err)}

.panes{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){ .panes.two{grid-template-columns:1fr 1fr} }
.pane{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel2);min-width:0}
.pane h4{margin:0;font-size:11px;padding:6px 10px;background:var(--panel2);color:var(--ink2);
  border-bottom:1px solid var(--line2);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.pane h4 span{font-family:var(--mono);font-size:10px;opacity:.75}
.pane pre{margin:0;padding:9px 10px;background:var(--code);color:var(--code-ink);
  font-family:var(--mono);font-size:11.5px;line-height:1.62;overflow-x:auto;
  font-variant-numeric:tabular-nums}
.pane.plain pre{background:var(--panel);color:var(--ink)}
.hl{display:block;background:rgba(31,111,235,.20);box-shadow:inset 2px 0 0 var(--acc);
    padding-left:6px;margin-left:-6px}
.hl.ok{background:rgba(18,138,83,.20);box-shadow:inset 2px 0 0 var(--ok)}
.hl.bad{background:rgba(192,38,38,.22);box-shadow:inset 2px 0 0 var(--err)}
.hl.mut{background:transparent;box-shadow:inset 2px 0 0 var(--line);opacity:.5}
.cm{color:#7d8899}
.ky{color:#79c0ff} .st{color:#a5d6ff} .gd{color:#7ee787} .bd{color:#ff7b72} .wr{color:#e3b341}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--code-ink);
  vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ── terms ── */
details.terms{margin-top:12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
details.terms>summary{cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--ink2);
  font-weight:600;list-style:none}
details.terms>summary::-webkit-details-marker{display:none}
details.terms>summary::before{content:"＋ ";color:var(--acc)}
details.terms[open]>summary::before{content:"－ "}
details.terms .body{padding:2px 12px 11px;border-top:1px solid var(--line2)}
details.terms dl{margin:0}
details.terms dt{font-size:13px;font-weight:700;margin-top:9px}
details.terms dt span{font-family:var(--mono);font-size:10.5px;color:var(--ink2);font-weight:500;margin-left:5px}
details.terms dd{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.58}
details.terms dd b{color:var(--ink)}

/* ── nav ── */
.nav{display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:9px;padding:8px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600}
.nav button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.nav button:disabled{opacity:.38;cursor:default}
.count{font-family:var(--mono);font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.keyhint{font-size:11.5px;color:var(--ink2);margin-left:auto}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink2);line-height:1.7}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>컨테이너와 쿠버네티스가 돌아가는 원리</h1>
  <p>내 코드 한 덩어리가 <b>격리된 실행 단위</b>가 되고, 죽어도 <b>스스로 되살아나는 상태</b>가 되기까지 — 9단계.</p>
  <button class="themebtn" id="themeBtn" type="button">◐ 테마</button>
</header>

<nav class="rail" id="rail" aria-label="단계 이동"></nav>

<div class="cols">
  <!-- 좌: 조작 + 무대 -->
  <section class="card stagewrap">
    <div class="demobar" id="demobar">
      <div class="demorow">
        <button class="demobtn" id="demoBtn" type="button"></button>
        <span class="hint" id="demoHint"></span>
      </div>
      <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
    </div>

    <svg class="stage" id="stage" viewBox="0 0 1160 630" role="img"
         aria-label="개발자 컴퓨터에서 이미지가 만들어져 창고를 거쳐 클러스터의 작업용 컴퓨터에서 실행되기까지의 전체 그림">
      <defs>
        <marker id="arw" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" fill="currentColor" style="fill:var(--line)"/></marker>
        <marker id="arwAcc" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--acc)"/></marker>
        <marker id="arwOk" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--ok)"/></marker>
        <marker id="arwErr" markerWidth="9" markerHeight="9" refX="7.4" refY="3.2" orient="auto">
          <path d="M0,0 L7.4,3.2 L0,6.4 z" style="fill:var(--err)"/></marker>
      </defs>
      <g id="cam">

      <!-- ── 개발자 컴퓨터 ── -->
      <g class="reg" id="r_dev">
        <rect class="regbox" x="16" y="44" width="286" height="470" rx="14"/>
        <text class="regttl" x="30" y="66">개발자 컴퓨터</text>
        <text class="regttl" x="36" y="238" style="opacity:.8">구워진 이미지 · 읽기 전용</text>
        <g class="nd idle" id="n_src" transform="translate(36,84)">
          <rect width="246" height="56" rx="9"/>
          <text class="t1" x="123" y="25">앱 코드 + 만드는 법 설명서</text>
          <text class="t2" x="123" y="43">Dockerfile</text>
        </g>
        <g class="nd idle" id="n_build" transform="translate(36,166)">
          <rect width="246" height="46" rx="9"/>
          <text class="t1" x="123" y="21">설명서를 한 줄씩 실행해 굽기</text>
          <text class="t2" x="123" y="37">docker build</text>
        </g>
        <g class="nd idle" id="n_l1" transform="translate(56,246)">
          <rect width="206" height="38" rx="7"/>
          <text class="t1" x="103" y="17">① 바탕 운영체제 파일</text>
          <text class="t2" x="103" y="31">FROM python:3.11-slim</text>
        </g>
        <g class="nd idle" id="n_l2" transform="translate(56,290)">
          <rect width="206" height="38" rx="7"/>
          <text class="t1" x="103" y="17">② 라이브러리 설치 결과</text>
          <text class="t2" x="103" y="31">RUN pip install -r req.txt</text>
        </g>
        <g class="nd idle" id="n_l3" transform="translate(56,334)">
          <rect width="206" height="38" rx="7"/>
          <text class="t1" x="103" y="17">③ 내 앱 코드</text>
          <text class="t2" x="103" y="31">COPY app/ .</text>
        </g>
        <g class="nd idle" id="n_ctr" transform="translate(36,410)">
          <rect width="246" height="56" rx="9"/>
          <text class="t1" x="123" y="25">격리되어 실행 중인 한 벌</text>
          <text class="t2" x="123" y="43">container</text>
        </g>
      </g>

      <!-- ── 이미지 창고 ── -->
      <g class="reg" id="r_reg">
        <rect class="regbox" x="322" y="186" width="152" height="168" rx="14"/>
        <text class="regttl" x="332" y="206">이미지 창고</text>
        <g class="nd idle" id="n_reg" transform="translate(336,216)">
          <rect width="124" height="110" rx="9"/>
          <text class="t1" x="62" y="44">올려두면</text>
          <text class="t1" x="62" y="60">어디서든 받는다</text>
          <text class="t2" x="62" y="80">registry</text>
        </g>
      </g>

      <!-- ── 관제부 ── -->
      <g class="reg" id="r_ctl">
        <rect class="regbox" x="492" y="44" width="652" height="150" rx="14"/>
        <text class="regttl" x="504" y="64">클러스터 관제부 · control plane</text>
        <g class="nd idle" id="n_api" transform="translate(506,80)">
          <rect width="148" height="96" rx="9"/>
          <text class="t1" x="74" y="38">들어온 요청 받고</text>
          <text class="t1" x="74" y="54">규칙에 맞는지 검사</text>
          <text class="t2" x="74" y="74">API server</text>
        </g>
        <g class="nd idle" id="n_etcd" transform="translate(668,80)">
          <rect width="134" height="96" rx="9"/>
          <text class="t1" x="67" y="38">"이렇게 돼 있어야"</text>
          <text class="t1" x="67" y="54">를 적어두는 장부</text>
          <text class="t2" x="67" y="74">etcd</text>
        </g>
        <g class="nd idle" id="n_ctrl" transform="translate(816,80)">
          <rect width="150" height="96" rx="9"/>
          <text class="t1" x="75" y="38">장부와 실제를</text>
          <text class="t1" x="75" y="54">쉬지 않고 비교</text>
          <text class="t2" x="75" y="74">controller</text>
        </g>
        <g class="nd idle" id="n_sched" transform="translate(980,80)">
          <rect width="150" height="96" rx="9"/>
          <text class="t1" x="75" y="38">어느 컴퓨터에</text>
          <text class="t1" x="75" y="54">올릴지 고르기</text>
          <text class="t2" x="75" y="74">scheduler</text>
        </g>
      </g>

      <!-- ── 작업용 컴퓨터 1 ── -->
      <g class="reg" id="r_n1">
        <rect class="regbox" x="492" y="344" width="322" height="164" rx="14"/>
        <text class="regttl" x="504" y="364">작업용 컴퓨터 1 · node</text>
        <g class="nd idle" id="n_kube1" transform="translate(506,372)">
          <rect width="140" height="36" rx="7"/>
          <text class="t1" x="70" y="16">이 컴퓨터의 관리자</text>
          <text class="t2" x="70" y="30">kubelet</text>
        </g>
        <g class="nd idle" id="n_p1" transform="translate(506,428)">
          <rect width="92" height="56" rx="8"/>
          <text class="t1" x="46" y="22">앱 한 벌</text>
          <text class="t2 ver" x="46" y="37">v1</text>
          <text class="badge" x="46" y="50">Pod</text>
        </g>
        <g class="nd idle" id="n_p2" transform="translate(608,428)">
          <rect width="92" height="56" rx="8"/>
          <text class="t1" x="46" y="22">앱 한 벌</text>
          <text class="t2 ver" x="46" y="37">v1</text>
          <text class="badge" x="46" y="50">Pod</text>
        </g>
        <g class="nd idle" id="n_p3" transform="translate(710,428)">
          <rect width="92" height="56" rx="8"/>
          <text class="t1" x="46" y="22">앱 한 벌</text>
          <text class="t2 ver" x="46" y="37">v1</text>
          <text class="badge" x="46" y="50">Pod</text>
        </g>
      </g>

      <!-- ── 작업용 컴퓨터 2 ── -->
      <g class="reg" id="r_n2">
        <rect class="regbox" x="826" y="344" width="318" height="164" rx="14"/>
        <text class="regttl" x="838" y="364">작업용 컴퓨터 2 · node</text>
        <g class="nd idle" id="n_kube2" transform="translate(840,372)">
          <rect width="140" height="36" rx="7"/>
          <text class="t1" x="70" y="16">이 컴퓨터의 관리자</text>
          <text class="t2" x="70" y="30">kubelet</text>
        </g>
        <g class="nd idle" id="n_p4" transform="translate(840,428)">
          <rect width="92" height="56" rx="8"/>
          <text class="t1" x="46" y="22">앱 한 벌</text>
          <text class="t2 ver" x="46" y="37">v1</text>
          <text class="badge" x="46" y="50">Pod</text>
        </g>
        <g class="nd idle" id="n_p5" transform="translate(942,428)">
          <rect width="92" height="56" rx="8"/>
          <text class="t1" x="46" y="22">앱 한 벌</text>
          <text class="t2 ver" x="46" y="37">v1</text>
          <text class="badge" x="46" y="50">Pod</text>
        </g>
        <g class="nd idle" id="n_p6" transform="translate(1044,428)">

function viewBoxFor(s){
  var f = (!fullView && s && s.graph) ? s.graph.focus : null;

  delay(function(){ setPos(od, 46, 0, T_OUT); }, 2100);
  delay(function(){ rollLoop(i+1); }, 2900);
}

/* ── 엔진 ───────────────────────────────────── */
function resetGraph(){
  NODES.forEach(function(id){ setNode(id,"idle"); });
  EDGES.forEach(function(id){ setEdge(id,"off"); });
  PODS.forEach(function(id){ setVer(id,"v1"); setPos(id, 0, 0, "none"); });
  REGS.forEach(function(id){ var el=$(id); if(el) el.classList.remove("dim"); });
  reflow();
}
function applyGraph(g){
  g = g || {};
  if(g.focus && g.focus.length){
    REGS.forEach(function(id){
      var el=$(id); if(el) el.classList.toggle("dim", g.focus.indexOf(id) === -1);
    });
  }
  if(g.n) for(var k in g.n) if(g.n.hasOwnProperty(k)) setNode(k, g.n[k]);
  if(g.e) for(var j in g.e) if(g.e.hasOwnProperty(j)) setEdge(j, g.e[j]);
  if(g.pods) for(var p in g.pods) if(g.pods.hasOwnProperty(p)) podOn(p, g.pods[p]);
}
function renderTerms(s){
  var host = $("termsHost");
  if(!s.terms || !s.terms.length){ host.innerHTML = ""; return; }
  var h = "<details class='terms'><summary>이 단계에서 처음 나온 말 " + s.terms.length + "개</summary><div class='body'><dl>";
  s.terms.forEach(function(t){
    h += "<dt>" + t.ko + "<span>" + (t.en||"") + "</span></dt><dd>" + t.def + "</dd>";
  });
  host.innerHTML = h + "</dl></div></details>";
}
var demoOn = false;
function renderDemo(s){
  var bar=$("demobar"), btn=$("demoBtn"), hint=$("demoHint"), v=$("verdict");
  if(!s.demo){ bar.classList.add("empty"); return; }
  bar.classList.remove("empty");
  demoOn = false;
  btn.textContent = s.demo.label;
  btn.classList.remove("on");
  btn.setAttribute("aria-pressed", "false");
  hint.textContent = s.demo.hint || "";
  v.className = "verdict";
  v.innerHTML = "<span style='color:var(--ink2)'>버튼을 눌러 보세요.</span>";
  btn.onclick = function(){
    demoOn = !demoOn;
    btn.textContent = demoOn ? (s.demo.labelOn || "되돌리기") : s.demo.label;
    btn.classList.toggle("on", demoOn);
    btn.setAttribute("aria-pressed", demoOn ? "true" : "false");
    var r = s.demo.run(demoOn);
    if(r){
      v.className = "verdict" + (r.tone ? " " + r.tone : "");
      v.innerHTML = r.t;
    }
  };
}
var cur = -1, seen = {};
function renderRail(){
  var h = "";
  STEPS.forEach(function(s,i){
    h += "<button type='button' data-i='" + i + "' class='" +
         (i===cur?"on":(seen[i]?"seen":"")) + "'><span class='no'>" + (i+1) + "</span>" + s.nav + "</button>";
  });
  $("rail").innerHTML = h;
  Array.prototype.forEach.call($("rail").querySelectorAll("button"), function(b){
    b.onclick = function(){ go(parseInt(b.getAttribute("data-i"),10)); };
  });
}
function go(n){
  n = Math.max(0, Math.min(STEPS.length-1, n));
  cur = n; seen[n] = true;
  var s = STEPS[n];
  stopAll();
  resetGraph();
  $("kicker").textContent = s.kicker;
  $("title").textContent  = s.title;
  $("desc").innerHTML     = s.desc;
  var panes = $("panes");
  panes.className = "panes" + (s.panesTwo ? " two" : "");
  panes.innerHTML = s.panels || "";
  renderTerms(s);
  applyGraph(s.graph);
  applyView(s);
  renderDemo(s);
  renderRail();
  $("count").textContent = (n+1) + " / " + STEPS.length;
  $("prev").disabled = (n === 0);
  $("next").disabled = (n === STEPS.length-1);
  if(s.enter) s.enter();
}
$("viewBtn").onclick = function(){
  fullView = !fullView;
  $("viewBtn").textContent = fullView ? "단계 구역만 보기" : "전체 보기";
  $("viewBtn").setAttribute("aria-pressed", fullView ? "true" : "false");
  applyView(STEPS[cur]);
};
$("prev").onclick = function(){ go(cur-1); };
$("next").onclick = function(){ go(cur+1); };
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key === "ArrowLeft"){ go(cur-1); }
  else if(e.key === "ArrowRight"){ go(cur+1); }
});
$("themeBtn").onclick = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme");
  r.setAttribute("data-theme", t === "dark" ? "light" : "dark");
};
go(0);
})();
